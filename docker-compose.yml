version: '3.8'

services:
  # 1. Local DynamoDB Container (zero AWS account needed)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    restart: always
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - app-network

  # 2. Go Backend Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saltwake-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TIMEOUT=30
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy-local-key
      - AWS_SECRET_ACCESS_KEY=dummy-local-secret
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    networks:
      - app-network

  # 3. React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saltwake-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  dynamodb-data:

networks:
  app-network:
    driver: bridge
